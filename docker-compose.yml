# Local end-to-end POC: RabbitMQ (broker) + optional Postgres (job store) + the
# worker built from the Dockerfile. Mirrors the cluster topology in miniature.
#
#   docker compose up -d rabbitmq postgres
#   docker compose run --rm worker python publisher.py --all
#   docker compose up worker                 # consumes the queue
#
# Values are plain env substitutions so no .env file is required.
services:
  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-cvt}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-cvt}
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # management UI (used by KEDA in the cluster)
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cvt
      POSTGRES_PASSWORD: cvt
      POSTGRES_DB: cvt
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docs/postgres_schema.sql:/docker-entrypoint-initdb.d/00_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvt"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: .
    image: cv-tailoring-worker:local
    command: ["python", "worker.py"]
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      QUEUE_BACKEND: amqp
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-cvt}:${RABBITMQ_PASSWORD:-cvt}@rabbitmq:5672/%2F
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      DB_BACKEND: ${DB_BACKEND:-postgres}
      DATABASE_URL: postgresql://cvt:cvt@postgres:5432/cvt
      DATABASE_SSLMODE: disable
      MODEL_STATE_BACKEND: ${MODEL_STATE_BACKEND:-postgres}
      LOG_FORMAT: json
      HEARTBEAT_FILE: /tmp/cvt/heartbeat
    volumes:
      - ./artifacts:/app/artifacts
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # The worker writes its own logs; no HTTP port to expose.

volumes:
  rabbitmq-data:
  postgres-data:
