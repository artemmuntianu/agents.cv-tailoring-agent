[project]
name = "cv-tailoring-agent"
version = "0.2.0"
description = "Event-driven CV tailoring worker (LangGraph + RabbitMQ on local Kubernetes)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["apps/worker/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
# The Python app moved to apps/worker after the monorepo restructure: this is what
# makes ruff treat `config`, `agent`, `utils`, `scout`, `archiver` as first-party.
src = ["apps/worker"]
extend-exclude = ["artifacts", "infra/charts", "infra/deploy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501", # long prompt/description strings are intentional
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"apps/worker/tests/*" = ["B011"]
