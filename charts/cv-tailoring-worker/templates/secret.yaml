{{- if and .Values.secrets.create (not .Values.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cv-tailoring-worker.fullname" . }}
  labels:
    {{- include "cv-tailoring-worker.labels" . | nindent 4 }}
type: Opaque
stringData:
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | quote }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  SUPABASE_URL: {{ .Values.secrets.supabaseUrl | quote }}
  SUPABASE_SERVICE_ROLE_KEY: {{ .Values.secrets.supabaseServiceRoleKey | quote }}
  RABBITMQ_URL: {{ .Values.secrets.rabbitmqUrl | quote }}
{{- end }}
