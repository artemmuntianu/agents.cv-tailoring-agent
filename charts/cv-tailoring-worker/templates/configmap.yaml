apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cv-tailoring-worker.fullname" . }}
  labels:
    {{- include "cv-tailoring-worker.labels" . | nindent 4 }}
data:
  SERVICE_NAME: {{ .Values.config.serviceName | quote }}
  QUEUE_BACKEND: {{ .Values.config.queueBackend | quote }}
  QUEUE_NAME: {{ .Values.config.queueName | quote }}
  PREFETCH_COUNT: {{ .Values.config.prefetchCount | quote }}
  MAX_ATTEMPTS: {{ .Values.config.maxAttempts | quote }}
  QUEUE_RETRY_TTL_MS: {{ .Values.config.queueRetryTtlMs | quote }}
  DB_BACKEND: {{ .Values.config.dbBackend | quote }}
  MODEL_STATE_BACKEND: {{ .Values.config.modelStateBackend | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  LOG_FORMAT: {{ .Values.config.logFormat | quote }}
  TEMP_ROOT: {{ .Values.config.tempRoot | quote }}
  {{- if .Values.config.artifactsDir }}
  ARTIFACTS_DIR: {{ .Values.config.artifactsDir | quote }}
  {{- end }}
  HEARTBEAT_FILE: {{ printf "%s/heartbeat" .Values.config.tempRoot | quote }}
  HEARTBEAT_MAX_AGE_SECONDS: {{ .Values.config.heartbeatMaxAgeSeconds | quote }}
  KEEP_TEMP_DIRS: {{ .Values.config.keepTempDirs | quote }}
  INTERACTIVE_QUOTA_WAIT: {{ .Values.config.interactiveQuotaWait | quote }}
  MODEL_NAME: {{ .Values.config.modelName | quote }}
  PREFERRED_MODELS: {{ .Values.config.preferredModels | quote }}
  DB_PREPARE_STATEMENTS: {{ .Values.config.dbPrepareStatements | quote }}
  DB_APPLICATION_NAME: {{ include "cv-tailoring-worker.fullname" . | quote }}
  MAX_REVISIONS: {{ .Values.config.maxRevisions | quote }}
  RENDER_DPI: {{ .Values.config.renderDpi | quote }}
