apiVersion: v2
name: cv-tailoring-platform
description: |
  Umbrella chart for the event-driven CV tailoring platform: RabbitMQ (broker
  pod rabbitmq-0), KEDA (operator + metrics server) and the AI worker
  deployment, installed with a single `helm upgrade --install`.
type: application
version: 0.2.0
appVersion: "0.2.0"
kubeVersion: ">=1.27.0-0"
dependencies:
  # Only KEDA comes from an upstream chart (its repository is healthy).
  #
  # RabbitMQ is rendered by this chart instead of the Bitnami subchart: Bitnami
  # moved their chart index behind repo.broadcom.com and emptied the free
  # `bitnami/*` image repositories in 2025, so a stock Bitnami release fails with
  # ImagePullBackOff. The design document allows either "StatefulSet or Bitnami
  # Helm chart"; we use a StatefulSet with the official `rabbitmq` image.
  - name: keda
    version: "2.15.x"
    repository: https://kedacore.github.io/charts
    condition: keda.enabled
  - name: cv-tailoring-worker
    version: "0.2.0"
    repository: "file://../cv-tailoring-worker"
    condition: cv-tailoring-worker.enabled
