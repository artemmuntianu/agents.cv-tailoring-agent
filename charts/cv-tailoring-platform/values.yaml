# Umbrella values: upstream subcharts + our worker.
#
# NOTE on key names: the top-level `keda:` key configures the **KEDA operator
# subchart**, while `cv-tailoring-worker.keda:` configures the worker's
# ScaledObject. They are different things on purpose.

# --------------------------------------------------------------------------- #
# RabbitMQ (pod group ① in the architecture doc): StatefulSet, always on.
# --------------------------------------------------------------------------- #
rabbitmq:
  enabled: true
  # Official image (Bitnami's free registry was emptied in 2025).
  image: rabbitmq:3.13-management
  imagePullPolicy: IfNotPresent
  # -> StatefulSet/pod named `rabbitmq-0`, DNS `rabbitmq.<ns>.svc.cluster.local`
  fullnameOverride: rabbitmq
  replicaCount: 1
  clustering:
    enabled: false
  auth:
    username: cvt
    # Provide either `existingPasswordSecret` (recommended) or a plain password.
    existingPasswordSecret: ""
    password: ""
  # The management plugin (needed by the KEDA scaler) is already enabled by the
  # `-management` image tag, and the queues are loaded from
  # `rabbitmqDefinitions` below - no extra configuration required here.
  persistence:
    enabled: true
    size: 4Gi
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Pre-declares the three queues from the design doc. The worker also declares
# its retry ladder (TTL queues) on connect, so this is a convenience, not a
# correctness requirement.
rabbitmqCredentials:
  # Create a `rabbitmq-credentials` Secret consumed by the worker
  # (RABBITMQ_URL) and by the KEDA TriggerAuthentication.
  create: true
  secretName: rabbitmq-credentials
  username: cvt
  password: ""

rabbitmqDefinitions:
  create: true
  secretName: rabbitmq-definitions
  definitions:
    rabbit_version: "3.13.0"
    # vhosts/users/permissions are filled in by templates/definitions.yaml from
    # `rabbitmqCredentials` (the broker refuses to seed them when load_definitions
    # is set). Set them explicitly here only when the credentials come from an
    # externally managed Secret.
    users: []
    vhosts: []
    permissions: []
    parameters: []
    global_parameters: []
    # Kept empty on purpose: the dead-letter target is a QUEUE ARGUMENT (see the
    # `resumes.generate` arguments below), because that is how
    # `utils/messaging.py::_declare_topology()` declares it. A policy that also sets
    # it is a second source of truth, and a pre-declared queue whose arguments differ
    # from the worker's declaration is rejected by the broker with
    # 406 PRECONDITION_FAILED - inequivalent arg 'x-dead-letter-exchange'.
    policies: []
    exchanges:
      - name: resumes.generate.dlx
        vhost: /
        type: direct
        durable: true
        auto_delete: false
        internal: false
        arguments: {}
    queues:
      - name: resumes.generate
        vhost: /
        durable: true
        auto_delete: false
        # MUST stay identical to utils/messaging.py::_declare_topology().
        arguments:
          x-dead-letter-exchange: resumes.generate.dlx
          x-dead-letter-routing-key: resumes.generate.dlq
      - name: resumes.generate.dlq
        vhost: /
        durable: true
        auto_delete: false
        arguments: {}
      - name: vacancies.parse
        vhost: /
        durable: true
        auto_delete: false
        arguments: {}
      - name: applications.submit
        vhost: /
        durable: true
        auto_delete: false
        arguments: {}
    bindings:
      - source: resumes.generate.dlx
        vhost: /
        destination: resumes.generate.dlq
        destination_type: queue
        routing_key: resumes.generate.dlq
        arguments: {}

# --------------------------------------------------------------------------- #
# KEDA (pod group ③): operator + metrics server.
# --------------------------------------------------------------------------- #
keda:
  enabled: true
  resources:
    operator:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
    metricServer:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
  prometheus:
    metricServer:
      enabled: true
    operator:
      enabled: true

# --------------------------------------------------------------------------- #
# Local development Postgres. Off by default (deploy/values/dev.yaml enables it);
# the worker creates its own tables on startup, so no init scripts are needed.
# --------------------------------------------------------------------------- #
localPostgres:
  enabled: false
  image: postgres:16-alpine
  secretName: local-postgres
  serviceName: postgres
  user: cvt
  password: cvt
  database: cvt
  size: 1Gi

# --------------------------------------------------------------------------- #
# Artifact storage: one volume for the master CV, job descriptions and results.
# --------------------------------------------------------------------------- #
persistence:
  create: true
  name: cv-artifacts
  mountPath: /data
  size: 2Gi
  storageClassName: ""

# A tiny always-on pod with the same volume mounted, so files can be pushed in
# and pulled out with `kubectl cp` even while the worker is scaled to zero:
#   kubectl cp .\cv.docx cv-files:/data/input/cv.docx
#   kubectl cp cv-files:/data/output/cv_848944.pdf .\
fileManager:
  enabled: true
  name: cv-files
  image: busybox:1.36
  # uid:gid that owns /data/input and /data/output. It MUST match the worker's
  # security context (cv-tailoring-worker.podSecurityContext runAsUser/runAsGroup):
  # the worker is deliberately unprivileged, so root-owned directories make its
  # first task die with
  # "[Errno 13] Permission denied: '/data/output/<name>.pdf'".
  owner: "10001:10001"

# --------------------------------------------------------------------------- #
# AI worker (pod group ②): Deployment + ScaledObject.
# --------------------------------------------------------------------------- #
cv-tailoring-worker:
  enabled: true
  fullnameOverride: ai-agent-worker
  image:
    repository: cv-tailoring-worker
    tag: "" # set by CI: --set cv-tailoring-worker.image.tag=$GITHUB_SHA
  # Secrets are created outside Helm in production; the values below are only
  # used when `existingSecret` is empty and `secrets.create` is true.
  existingSecret: ""
  secrets:
    create: false
    geminiApiKey: ""
    databaseUrl: ""
    rabbitmqUrl: ""
  config:
    queueName: resumes.generate
  keda:
    enabled: true
    auth:
      secretName: rabbitmq-credentials
      urlKey: rabbitmq-management-url
      usernameKey: rabbitmq-username
      passwordKey: rabbitmq-password
    minReplicaCount: 0
    maxReplicaCount: 20
    mode: QueueLength
    queueLength: "1"
    cooldownPeriod: 300
    pollingInterval: 15
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
