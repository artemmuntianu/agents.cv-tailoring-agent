{{/*
  All artifacts live on one PersistentVolumeClaim owned by this release:

      /data/cv_data.json      structured CV model (must match cv.docx exactly)
      /data/input/cv.docx     master CV
      /data/input/jd_*.txt    job descriptions (CLI-style batches)
      /data/output/cv_*.pdf   tailored results written by the worker

  With this in place the platform needs no external storage at all.

  `cv-files` is a tiny always-on pod that mounts the same volume so files can be
  pushed in / pulled out with `kubectl cp` whenever the worker is scaled to zero:

      kubectl cp .\cv.docx cv-files:/data/input/cv.docx
      kubectl cp cv-files:/data/output/cv_848944.pdf .\
*/}}
{{- if .Values.persistence.create }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.persistence.name }}
  labels:
    app.kubernetes.io/part-of: cv-tailoring-platform
    app.kubernetes.io/component: storage
  annotations:
    # Survives `helm uninstall` - your CV and results are not chart state.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
{{- if .Values.fileManager.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.fileManager.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.fileManager.name }}
    app.kubernetes.io/part-of: cv-tailoring-platform
    app.kubernetes.io/component: storage
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.fileManager.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.fileManager.name }}
    spec:
      containers:
        - name: files
          image: {{ .Values.fileManager.image | quote }}
          command:
            - sh
            - -c
            - mkdir -p {{ .Values.persistence.mountPath }}/input {{ .Values.persistence.mountPath }}/output && sleep infinity
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: artifacts
              mountPath: {{ .Values.persistence.mountPath }}
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.name }}
{{- end }}
