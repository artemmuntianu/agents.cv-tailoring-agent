apiVersion: v1
kind: Pod
metadata:
  name: {{ include "cv-tailoring-worker.fullname" . }}-health-test
  labels:
    {{- include "cv-tailoring-worker.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  serviceAccountName: {{ include "cv-tailoring-worker.serviceAccountName" . }}
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: healthcheck
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      # Proves the image ships poppler + LibreOffice, and that the broker is
      # reachable from inside the cluster.
      command: ["sh", "-c", "python healthcheck.py --mode render && python healthcheck.py --mode amqp"]
      envFrom:
        - configMapRef:
            name: {{ include "cv-tailoring-worker.fullname" . }}
        - secretRef:
            name: {{ include "cv-tailoring-worker.secretName" . }}
      # The broker address/credentials are NOT in the ConfigMap or the worker
      # Secret: the Deployment injects them from the broker Secret. Without the
      # same env here, `--mode amqp` composes the default guest@localhost:5672 and
      # the probe always fails.
      {{- if eq .Values.config.queueBackend "amqp" }}
      env:
        - name: RABBITMQ_HOST
          value: {{ .Values.config.rabbitmqHost | quote }}
        - name: RABBITMQ_PORT
          value: {{ .Values.config.rabbitmqPort | quote }}
        - name: RABBITMQ_VHOST
          value: {{ .Values.config.rabbitmqVhost | quote }}
        - name: RABBITMQ_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ .Values.rabbitmqCredentials.secretName }}
              key: {{ .Values.rabbitmqCredentials.usernameKey }}
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.rabbitmqCredentials.secretName }}
              key: {{ .Values.rabbitmqCredentials.passwordKey }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
