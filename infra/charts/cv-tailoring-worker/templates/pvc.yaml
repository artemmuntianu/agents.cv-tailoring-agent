{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
# Optional: lets this chart own its artifact volume. The platform chart usually
# creates `cv-artifacts` once and hands it over via `persistence.existingClaim`.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-artifacts" (include "cv-tailoring-worker.fullname" .) }}
  labels:
    {{- include "cv-tailoring-worker.labels" . | nindent 4 }}
  annotations:
    # Keep the tailored CVs and the master CV when the release is uninstalled.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
