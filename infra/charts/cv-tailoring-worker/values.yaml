# Default values for cv-tailoring-worker.
# IMPORTANT: never put real secrets in this file - use `existingSecret`
# (Kubernetes Secret / Key Vault via external-secrets) or `--set` from CI.

# KEDA owns the replica count (0 -> N -> 0), so the Deployment starts at zero.
replicaCount: 0

# Matches the pod names in the architecture document (ai-agent-worker-*).
fullnameOverride: ai-agent-worker

image:
  # Locally built image (no registry): the cluster reads it from Docker's
  # image store. Set repository/tag to a registry path if you ever push it.
  repository: cv-tailoring-worker
  tag: dev
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
serviceAccount:
  create: true
  name: ""
  annotations: {} # e.g. for external secret stores / workload identity

podAnnotations: {}
podLabels: {}

# Non-secret runtime configuration -> ConfigMap.
config:
  serviceName: cv-tailoring-worker
  queueBackend: amqp
  dbBackend: postgres
  modelStateBackend: postgres
  queueName: resumes.generate
  prefetchCount: 1
  # Broker address; credentials come from `rabbitmqCredentials` below so the
  # password is defined once (shared with the KEDA TriggerAuthentication).
  rabbitmqHost: rabbitmq
  rabbitmqPort: 5672
  rabbitmqVhost: "/"
  maxAttempts: 3
  queueRetryTtlMs: 300000
  # AMQP heartbeat; must exceed the longest task (see config.AMQP_HEARTBEAT_SECONDS).
  amqpHeartbeatSeconds: 600
  logLevel: INFO
  logFormat: json
  tempRoot: /tmp/cvt
  heartbeatMaxAgeSeconds: 300
  keepTempDirs: false
  interactiveQuotaWait: false
  # WARNING: replace with the model IDs your API key can access. The worker
  # refuses to start when MODEL_NAME is missing from models.list(), because a
  # wrong id is a non-retryable 400 that would send every task to the DLQ.
  modelName: gemini-3.5-flash
  # Comma-separated fallback ladder, most preferred first (empty = built-in).
  preferredModels: ""
  maxRevisions: 3
  renderDpi: 70
  # A pooled Postgres connection cannot use prepared statements.
  dbPrepareStatements: false
  # Where artifacts live (input/cv.docx, input/jd_*.txt, output/cv_*.docx|pdf).
  # In the cluster this is the mounted volume, e.g. /data - see `persistence`.
  artifactsDir: ""

# Secret values. `create: false` is the recommended production setting: create a
# Secret out-of-band and point `existingSecret` at it.
secrets:
  create: false
  geminiApiKey: ""
  databaseUrl: ""
  rabbitmqUrl: ""

# Name of a pre-existing Secret holding the keys above (GEMINI_API_KEY,
# DATABASE_URL, RABBITMQ_URL - see scripts/worker-secret.ps1).
existingSecret: ""

# Artifact storage that survives pod restarts and scale-to-zero.
# `existingClaim` points at a PVC owned by another release (the platform chart
# creates `cv-artifacts`); `enabled` makes this chart create its own.
persistence:
  enabled: false
  existingClaim: ""
  mountPath: /data
  size: 2Gi
  storageClassName: ""

# Secret holding the broker credentials (also used by KEDA). When
# `existingSecret` supplies RABBITMQ_URL, that value wins over these parts.
rabbitmqCredentials:
  secretName: rabbitmq-credentials
  usernameKey: rabbitmq-username
  passwordKey: rabbitmq-password

# Extra env vars / envFrom entries for advanced overrides.
extraEnv: []
extraEnvFrom: []

service:
  # Exposed only if a health endpoint is ever added; the worker needs no Service.
  enabled: false
  port: 8080

resources:
  # Sized per the architecture doc: PDF conversion is the CPU spike.
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

# A 15-45s task (x3 revisions) must be allowed to finish before the pod dies.
terminationGracePeriodSeconds: 120

livenessProbe:
  enabled: true
  initialDelaySeconds: 20
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

# The cover-letter worker: the same image and configuration, a different entry point
# (`cover.py`) and a different queue. Separate on purpose - a letter neither waits behind a
# tailoring backlog nor wakes a tailoring pod, because each queue has its own ScaledObject.
cover:
  enabled: true
  # KEDA keeps one pod warm: a letter is asked for by a click (or by a move into Prepare) and
  # the cold start is the most visible part of that wait. Nothing converts documents here, so an
  # idle pod is cheaper than the latency.
  minReplicaCount: 1
  # One letter is one short Gemini call: nothing converts documents here.
  maxReplicaCount: 3
  queueName: resumes.cover
  # Empty = inherit the worker's `resources` above.
  resources: {}

# The application-form worker: the same image and configuration, a different entry point
# (`apply.py`) and a different queue. The extension publishes the *rendered* form it annotated;
# the worker answers with a plan - which field gets what - and the extension applies it to the DOM.
# Separate from the other two for the same reason: a form draft neither waits behind a tailoring
# backlog nor wakes a tailoring pod.
apply:
  enabled: true
  # Same warm-pod rule as the cover worker: Populate is a click, and the form draft is the
  # middle of three steps the operator is watching.
  minReplicaCount: 1
  # One form is one Gemini call, and a burst is rare (the operator clicks Populate).
  maxReplicaCount: 3
  queueName: applications.draft
  # Empty = inherit the worker's `resources` above.
  resources: {}

# The hand-edited-deliverable worker: the same image and configuration, a different entry point
# (`rerender.py`) and a different queue. The board's *Update docx* button stores the DOCX the
# operator edited and this workload renders it back into the card's PDF, so it is the only
# consumer that needs the tailoring worker's own heavy tool - LibreOffice - and the only one that
# writes artifacts rather than a text column.
rerender:
  enabled: true
  # Warm, like the other two click-driven workers: the operator is watching the modal when a
  # conversion starts.
  minReplicaCount: 1
  # Seconds of CPU each, and a burst is as rare as the operator's clicks.
  maxReplicaCount: 3
  queueName: resumes.rerender
  # Empty = inherit the worker's `resources` above.
  resources: {}

keda:
  enabled: true
  minReplicaCount: 0
  maxReplicaCount: 20
  # How fast a waiting message is noticed (KEDA polls the broker's management API). At 15s a
  # click could spend that long *before* a pod even started; 5s is still one cheap HTTP call.
  pollingInterval: 5
  cooldownPeriod: 300
  # 1 pod per pending message ("20 vacancies -> 20 pods" in the design docs).
  queueLength: "1"
  activationQueueLength: "0"
  # QueueLength == ready + unacked, which is what we want for 15-45s tasks.
  mode: QueueLength
  # protocol MUST be http: it makes the scaler read `messages` from the RabbitMQ
  # management API, which counts UNACKNOWLEDGED messages too. With `amqp` the count
  # is ready-only, so KEDA scales the pod to zero the moment the worker prefetches
  # its job - killing the task mid-flight (observed: scale-up and scale-down 60s
  # apart while the task was still running).
  protocol: http
  # Credentials come from a Secret via TriggerAuthentication (never inline).
  auth:
    secretName: rabbitmq-credentials
    # Keys holding the connection URLs (amqp for the worker, http for the scaler).
    urlKey: rabbitmq-management-url
    usernameKey: rabbitmq-username
    passwordKey: rabbitmq-password
  fallback:
    enabled: true
    failureThreshold: 3
    replicas: 1
  behavior: {}

podDisruptionBudget:
  enabled: false
  minAvailable: 0

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false # /tmp is an emptyDir; /app stays read-only-safe
  capabilities:
    drop:
      - ALL
