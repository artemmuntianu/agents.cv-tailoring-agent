{{- /*
  The startup trigger: the same intake, run once as part of `helm install`/`helm upgrade`.

  "At startup" has to mean the deploy, not a slot up to 30 minutes away, so this is a **Helm
  hook** (`post-install,post-upgrade`): Helm creates it after the release's objects are in the
  cluster, and `--wait` does not return until the hook is done - which is what
  `scripts/local-deploy.ps1` uses. The trade-off is honest and deliberate: a startup run that
  fails fails the release, because "the intake did not run" is what just happened. Nothing is
  lost by that - the run is idempotent (board-scoped dedupe + `upsert_job`) and `backoffLimit`
  still retries a transient feed or database failure - the next deploy or cron slot is free to
  try again.

  It renders only when the intake is actually configured (`config.userId`): the preflight
  refuses to run without an owner account, so a hook that could not succeed must not be created
  - otherwise a chart installed with the defaults would fail its own install.

  The pod itself is the shared template (`_helpers.tpl`), and only the ledger's `--trigger`
  differs from a CronJob slot. The hook Job is a separate object from the CronJob, so it can
  overlap a slot (`concurrencyPolicy` does not apply to it): that is safe by design - two
  intakes de-duplicating against the same board create one card per vacancy and the log says
  "another intake got there first".
*/ -}}
{{- if and .Values.enabled .Values.startup.enabled .Values.config.userId }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-startup" (include "cv-tailoring-scout.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "cv-tailoring-scout.labels" . | nindent 4 }}
  annotations:
    # This annotation is what makes the Job a trigger rather than a release object.
    "helm.sh/hook": {{ .Values.startup.hook | quote }}
    # Every install/upgrade runs it again: the previous Job has to go first (`before-hook-creation`
    # is Helm's own default, spelled out because a leftover Job makes the next upgrade fail with
    # "already exists"), and a successful one is deleted - the ledger row is the record. A
    # *failed* Job is kept on purpose, so its pod log can still be read.
    "helm.sh/hook-delete-policy": {{ .Values.startup.hookDeletePolicy | quote }}
spec:
  backoffLimit: {{ .Values.backoffLimit }}
  # A hung fetch must not hold the deploy forever (`--timeout` is the outer bound).
  activeDeadlineSeconds: {{ .Values.activeDeadlineSeconds }}
  {{- include "cv-tailoring-scout.podTemplate" (dict "root" $ "command" (list "python" "-m" "scout" "--trigger" "startup")) | nindent 2 }}
{{- end }}
