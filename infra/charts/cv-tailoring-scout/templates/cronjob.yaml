{{- if .Values.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "cv-tailoring-scout.fullname" . }}
  labels:
    {{- include "cv-tailoring-scout.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.schedule | quote }}
  # Wall-clock, not UTC: "07:30" has to mean 07:30 in the operator's day, DST included.
  timeZone: {{ .Values.timeZone | quote }}
  # The missed-slot rule: a cluster that was off at a scheduled time still runs the intake as
  # soon as it is back, as long as it is within this deadline (`values.yaml` says why).
  startingDeadlineSeconds: {{ .Values.startingDeadlineSeconds }}
  concurrencyPolicy: {{ .Values.concurrencyPolicy | quote }}
  suspend: {{ .Values.suspend }}
  successfulJobsHistoryLimit: {{ .Values.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.backoffLimit }}
      # A hung fetch must not hold the slot forever.
      activeDeadlineSeconds: {{ .Values.activeDeadlineSeconds }}
      {{- include "cv-tailoring-scout.podTemplate" (dict "root" $ "command" (list "python" "-m" "scout")) | nindent 6 }}
{{- end }}
