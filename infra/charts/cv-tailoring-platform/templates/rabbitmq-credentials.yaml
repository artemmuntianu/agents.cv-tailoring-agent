{{- if .Values.rabbitmqCredentials.create }}
{{- $username := include "cv-tailoring-platform.rabbitmqUsername" . }}
{{- $password := .Values.rabbitmqCredentials.password | default .Values.rabbitmq.auth.password | default "" }}
# Credentials shared by the worker (AMQP URL) and the KEDA TriggerAuthentication
# (management API user/password). In production prefer an externally managed
# Secret (Key Vault / external-secrets) and set `create: false`.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.rabbitmqCredentials.secretName }}
  labels:
    app.kubernetes.io/part-of: cv-tailoring-platform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  rabbitmq-username: {{ $username | quote }}
  rabbitmq-password: {{ $password | quote }}
  rabbitmq-url: {{ printf "amqp://%s:%s@%s.%s.svc.cluster.local:5672/%%2F" $username $password (include "cv-tailoring-platform.rabbitmqName" .) .Release.Namespace | quote }}
  # Management API URL for the KEDA scaler (`protocol: http`): its `messages`
  # counter includes UNACKNOWLEDGED messages, which is what stops KEDA scaling a
  # busy worker to zero mid-task. The AMQP count (`queue.declare-ok`) is
  # ready-only, so a prefetched job looks like an empty queue.
  rabbitmq-management-url: {{ printf "http://%s:%s@%s.%s.svc.cluster.local:15672/%%2F" $username $password (include "cv-tailoring-platform.rabbitmqName" .) .Release.Namespace | quote }}
{{- end }}
