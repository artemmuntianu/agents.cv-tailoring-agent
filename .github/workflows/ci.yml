name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: lint + tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cvt
          POSTGRES_PASSWORD: cvt
          POSTGRES_DB: cvt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cvt"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: python -m ruff check .

      - name: Pytest
        # Postgres comes from the service container so the production-store tests
        # really run; everything else is hermetic (no network, no Gemini,
        # LibreOffice rendering is stubbed).
        env:
          TEST_DATABASE_URL: postgresql://cvt:cvt@localhost:5432/cvt
        run: python -m pytest -q

  charts:
    name: helm lint + render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Lint worker chart
        run: helm lint charts/cv-tailoring-worker

      - name: Lint the scheduled-job charts
        # The umbrella lint below covers them too (once the dependency update has vendored
        # them), but a direct lint names the chart that broke.
        run: |
          helm lint charts/cv-tailoring-scout
          helm lint charts/cv-tailoring-archiver

      - name: Resolve umbrella dependencies
        run: helm dependency update charts/cv-tailoring-platform

      - name: Lint umbrella chart
        run: helm lint charts/cv-tailoring-platform

      - name: Render manifests
        run: |
          helm template cv-tailoring charts/cv-tailoring-platform \
            -f deploy/values/dev.yaml --set cv-tailoring-worker.image.tag=ci \
            > /tmp/rendered-dev.yaml
          wc -l /tmp/rendered-dev.yaml

      - name: Validate rendered manifests (kubeconform)
        run: |
          docker run --rm -v /tmp:/manifests ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary -ignore-missing-schemas \
            -kubernetes-version 1.30.0 /manifests/rendered-dev.yaml

  backoffice:
    name: backoffice (astro + react)
    runs-on: ubuntu-latest
    # The POC's own gates, all hermetic (no database, no broker): vitest, the types and the SSR
    # bundle. `npm ci` is the lockfile-exact install; on Windows a running `npm run dev` holds
    # `node_modules/lightningcss-*/lightningcss.*.node` so the wipe fails with EPERM - use
    # `npm install` there (the same caveat is in .github/AGENTS.md).
    defaults:
      run:
        working-directory: backoffice
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backoffice/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Types
        run: npx tsc --noEmit

      - name: Tests (vitest, jsdom, no cluster)
        run: npm test

      - name: Build the SSR bundle
        run: npm run build
