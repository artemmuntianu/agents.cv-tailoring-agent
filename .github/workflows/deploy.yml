name: deploy

# Manual/release deploy of the platform chart. Requires the repository secrets
# AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID (OIDC federated
# credentials) and an existing AKS cluster (see deploy/infra/).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, staging, prod]
        default: dev
      image_tag:
        description: Image tag to deploy (defaults to the commit SHA)
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: helm upgrade --install
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP || 'rg-cvtailoring' }}
      CLUSTER_NAME: ${{ vars.CLUSTER_NAME || 'cvtailoring' }}
      NAMESPACE: ${{ vars.NAMESPACE || 'default' }}
      RELEASE: cv-tailoring
      IMAGE: ghcr.io/${{ github.repository }}/cv-tailoring-worker
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get cluster credentials
        run: az aks get-credentials -g "$RESOURCE_GROUP" -n "$CLUSTER_NAME" --overwrite-existing

      - name: Resolve chart dependencies
        run: helm dependency update charts/cv-tailoring-platform

      - name: Helm diff (plan)
        run: |
          helm plugin install https://github.com/databus23/helm-diff --version v3.9.5 || true
          helm diff upgrade "$RELEASE" charts/cv-tailoring-platform \
            -f "deploy/values/${{ inputs.environment }}.yaml" \
            --set cv-tailoring-worker.image.repository="$IMAGE" \
            --set cv-tailoring-worker.image.tag="${{ inputs.image_tag || github.sha }}" || true

      - name: Deploy
        run: |
          helm upgrade --install "$RELEASE" charts/cv-tailoring-platform \
            --namespace "$NAMESPACE" --create-namespace \
            -f "deploy/values/${{ inputs.environment }}.yaml" \
            --set cv-tailoring-worker.image.repository="$IMAGE" \
            --set cv-tailoring-worker.image.tag="${{ inputs.image_tag || github.sha }}" \
            --atomic --wait --timeout 10m

      - name: Post-deploy status
        run: |
          kubectl get pods,scaledobject -n "$NAMESPACE"
          kubectl exec -n "$NAMESPACE" rabbitmq-0 -- \
            rabbitmqctl list_queues name messages messages_ready messages_unacknowledged || true
