# Local cluster (Docker Desktop Kubernetes / kind / k3d / k3s) overrides.
# Nothing here costs money and nothing talks to Azure.
#
#   powershell -ExecutionPolicy Bypass -File .\scripts\local-deploy.ps1
#
# Only two things stay external (both free): the Gemini API and Supabase Storage
# (your master CV already lives there). Everything else - RabbitMQ, KEDA,
# Postgres - runs inside your own cluster, exercising the production code paths.

# Local development Postgres: real Postgres, no cloud database needed.
# The worker creates its own tables on startup.
localPostgres:
  enabled: true
  image: postgres:16-alpine
  secretName: local-postgres
  serviceName: postgres
  user: cvt
  password: cvt
  database: cvt
  size: 1Gi

rabbitmq:
  enabled: true
  persistence:
    enabled: true
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 384Mi

rabbitmqCredentials:
  create: true
  # Dev-only password; production uses an externally managed Secret.
  password: dev-only-change-me

rabbitmqDefinitions:
  create: true

keda:
  enabled: true

cv-tailoring-worker:
  enabled: true
  image:
    repository: cv-tailoring-worker
    tag: dev
    pullPolicy: IfNotPresent
  # Created by .\scripts\worker-secret.ps1:
  #   GEMINI_API_KEY, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, DATABASE_URL
  # RABBITMQ_USERNAME/PASSWORD come from the broker Secret (shared with KEDA),
  # so no AMQP URL is stored anywhere.
  existingSecret: cv-tailoring-secrets
  config:
    logLevel: DEBUG
    logFormat: text
    storageBackend: supabase
    dbBackend: postgres
    modelStateBackend: postgres
  keda:
    minReplicaCount: 0
    maxReplicaCount: 3
    cooldownPeriod: 60
    pollingInterval: 10
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
