# Local cluster (Docker Desktop Kubernetes / kind / k3d / k3s) overrides.
# Nothing here costs money and nothing talks to the cloud.
#
#   powershell -ExecutionPolicy Bypass -File .\scripts\local-deploy.ps1
#
# Everything runs inside your cluster: RabbitMQ, KEDA, Postgres AND the artifact
# storage (a PersistentVolumeClaim). The only external dependency left is the
# Gemini API.
#
# Files live on the `cv-artifacts` volume:
#   /data/cv_data.json     structured CV model
#   /data/input/cv.docx    master CV
#   /data/output/*.pdf     tailored results
# Push/pull them with:  .\scripts\storage-files.ps1 -Action seed | list | download

# Local development Postgres: real Postgres, no cloud database needed.
# The worker creates its own tables on startup.
localPostgres:
  enabled: true
  image: postgres:16-alpine
  secretName: local-postgres
  serviceName: postgres
  user: cvt
  password: cvt
  database: cvt
  size: 1Gi

rabbitmq:
  enabled: true
  persistence:
    enabled: true
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 384Mi

rabbitmqCredentials:
  create: true
  # Dev-only password; production uses an externally managed Secret.
  password: dev-only-change-me

rabbitmqDefinitions:
  create: true

keda:
  enabled: true

cv-tailoring-worker:
  enabled: true
  image:
    repository: cv-tailoring-worker
    tag: dev
    pullPolicy: IfNotPresent
  # Created by .\scripts\worker-secret.ps1:
  #   GEMINI_API_KEY, DATABASE_URL
  # RABBITMQ_USERNAME/PASSWORD come from the broker Secret (shared with KEDA),
  # so no AMQP URL is stored anywhere.
  existingSecret: cv-tailoring-secrets
  # Artifacts on the shared cluster volume.
  persistence:
    existingClaim: cv-artifacts
    mountPath: /data
  config:
    logLevel: DEBUG
    logFormat: text
    storageBackend: local
    artifactsDir: /data
    dbBackend: postgres
    modelStateBackend: postgres
  keda:
    minReplicaCount: 0
    maxReplicaCount: 3
    cooldownPeriod: 60
    pollingInterval: 10
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
