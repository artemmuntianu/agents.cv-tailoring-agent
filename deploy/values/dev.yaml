# Docker Desktop Kubernetes overrides - the only supported runtime
# (Settings -> Kubernetes -> kubeadm, so the cluster shares Docker's image store).
# Nothing here costs money and nothing talks to the cloud.
#
#   powershell -ExecutionPolicy Bypass -File .\scripts\local-deploy.ps1
#
# Everything runs inside your cluster: RabbitMQ, KEDA, Postgres AND the artifact
# storage (a PersistentVolumeClaim). The only external dependency left is the
# Gemini API.
#
# Files live on the `cv-artifacts` volume:
#   /data/cv_data.json     structured CV model
#   /data/input/cv.docx    master CV
#   /data/output/*.pdf     tailored results
# Push/pull them with:  .\scripts\storage-files.ps1 -Action seed | list | download

# Local development Postgres: real Postgres, no cloud database needed.
# The worker creates its own tables on startup.
localPostgres:
  enabled: true
  image: postgres:16-alpine
  secretName: local-postgres
  serviceName: postgres
  user: cvt
  password: cvt
  database: cvt
  size: 1Gi

rabbitmq:
  enabled: true
  persistence:
    enabled: true
    size: 1Gi
  # RabbitMQ's first boot (Erlang VM + plugins + loading the definitions) is
  # CPU-hungry and every `rabbitmq-diagnostics` probe spawns another Erlang VM.
  # 50m/250m starves it on Docker Desktop, so the broker never becomes Ready and
  # the liveness probe restarts it forever. The chart default (100m/500m) is the
  # floor; a local cluster can afford a whole core.
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 768Mi

rabbitmqCredentials:
  create: true
  # Dev-only password; production uses an externally managed Secret.
  password: dev-only-change-me

rabbitmqDefinitions:
  create: true

keda:
  enabled: true

cv-tailoring-worker:
  enabled: true
  image:
    repository: cv-tailoring-worker
    tag: dev
    pullPolicy: IfNotPresent
  # Created by .\scripts\worker-secret.ps1:
  #   GEMINI_API_KEY, DATABASE_URL
  # RABBITMQ_USERNAME/PASSWORD come from the broker Secret (shared with KEDA),
  # so no AMQP URL is stored anywhere.
  existingSecret: cv-tailoring-secrets
  # Artifacts on the shared cluster volume.
  persistence:
    existingClaim: cv-artifacts
    mountPath: /data
  config:
    logLevel: DEBUG
    logFormat: text
    storageBackend: local
    artifactsDir: /data
    dbBackend: postgres
    modelStateBackend: postgres
    # The chart default (gemini-3.5-flash) is a placeholder: an id this API key
    # cannot use - or whose free-tier budget is spent (20 requests/day PER MODEL,
    # and one CV needs 1-3 adaptations plus a vision check per rendered page) -
    # sends every task to the DLQ. Pick ids with
    # `python scripts/check_models.py --strict`, most preferred first; each model
    # has its own daily budget, so a short ladder is the real fallback.
    modelName: gemini-3.5-flash-lite
    preferredModels: gemini-3.5-flash-lite,gemini-3.1-flash-lite
  keda:
    minReplicaCount: 0
    maxReplicaCount: 3
    cooldownPeriod: 60
    pollingInterval: 10
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
